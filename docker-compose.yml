services:
  database:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: atlas_db
    ports:
      - "3306:3306"
    volumes:
      - atlas_data:/var/lib/mysql
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./server
    ports:
      - "3310:3310"
    volumes:
      - ./server:/api
      - /api/node_modules
    environment:
      APP_PORT: 3310
      DB_HOST: database
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: atlas_db
      CLIENT_URL: http://localhost:3000
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./client
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:3310
    depends_on:
      - backend

volumes:
  atlas_data: